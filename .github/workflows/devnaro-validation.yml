name: DevNaro validation

on:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.13.7"

      - name: Install locked package and development dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest

  repository-validation:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: |
          bash -n scripts/host/install.sh
          bash -n scripts/host/uninstall.sh
          bash -n scripts/host/devnaro
          bash -n scripts/host/ci.sh
          bash -n scripts/host/compose.sh
          bash -n scripts/host/ui.sh
          bash -n scripts/host/start.sh
          bash -n scripts/host/stop.sh
          bash -n scripts/host/clean.sh
          LC_ALL=C bash scripts/host/devnaro help > /tmp/devnaro-help.txt
          grep -Fq '╭' /tmp/devnaro-help.txt
          grep -Fq '╰' /tmp/devnaro-help.txt
          grep -Fq 'devnaro ci' /tmp/devnaro-help.txt
          ! grep -Fq '�' /tmp/devnaro-help.txt
          sh -n scripts/container/entrypoint.sh
          python3 -m py_compile scripts/container/code

      - name: Validate Docker Compose configuration
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml config --quiet

  docker-image-build:
    needs:
      - python-tests
      - repository-validation
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - base-image: debian:trixie-slim
            stack-name: default
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build DevNaro image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: devnaro:ci
          cache-from: type=gha,scope=devnaro-validation-${{ matrix.base-image }}-${{ matrix.stack-name }}
          cache-to: type=gha,mode=max,scope=devnaro-validation-${{ matrix.base-image }}-${{ matrix.stack-name }}
          build-args: |
            USERNAME=devuser
            BASE_IMAGE=${{ matrix.base-image }}
            STACK_NAME=${{ matrix.stack-name }}

      - name: Start DevNaro container
        run: |
          mkdir -p "$RUNNER_TEMP/devnaro-workspace"
          docker volume create devnaro-home-ci
          docker run --rm --network host --volume devnaro-home-ci:/mnt/home --entrypoint sh devnaro:ci \
            -ec 'cp -a /home/devuser/. /mnt/home/ && chown -R 0:0 /mnt/home && chmod -R u+rwX,go+rX /mnt/home'
          docker run --detach --network host --name devnaro-ci \
            --env DEVNARO_CONTAINER=devnaro-ci \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/devnaro-workspace:/workspace" \
            --volume devnaro-home-ci:/home/devuser \
            devnaro:ci

      - name: Run container smoke tests
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' devnaro-ci)" == "true" ]]; then
              break
            fi
            sleep 1
          done

          echo "Smoke check: container is running"
          test "$(docker inspect --format '{{.State.Running}}' devnaro-ci)" = "true"
          echo "Smoke check: DevNaro Manager version"
          docker exec devnaro-ci devnaro --version
          echo "Smoke check: container runs as root"
          test "$(docker exec devnaro-ci id -u)" = "0"
          echo "Smoke check: HOME ownership and write access"
          docker exec devnaro-ci sh -ec 'test "$HOME" = "/home/devuser" && test -d "$HOME" && test -w "$HOME"'
          echo "Smoke check: apt-get version"
          docker exec devnaro-ci apt-get --version
          echo "Smoke check: apt-get update"
          docker exec devnaro-ci apt-get update
          echo "Smoke check: install jq"
          docker exec devnaro-ci apt-get install -y --no-install-recommends jq
          echo "Smoke check: jq version"
          docker exec devnaro-ci jq --version
          echo "Smoke check: oh-my-zsh ownership and permissions"
          docker exec devnaro-ci sh -ec 'test "$(stat -c %u /home/devuser/.oh-my-zsh)" = "0" && test "$(stat -c %u /home/devuser/.oh-my-zsh/custom)" = "0" && test -z "$(find /home/devuser/.oh-my-zsh -type d -perm /022 -print -quit)"'
          echo "Smoke check: zsh compaudit"
          compaudit_output="$(docker exec devnaro-ci zsh -c 'source ~/.zshrc >/dev/null 2>&1; autoload -Uz compaudit; compaudit')"
          if [[ -n "$compaudit_output" ]]; then
            printf 'compaudit found insecure completion paths:\n%s\n' "$compaudit_output" >&2
            exit 1
          fi
          echo "Smoke check: DevNaro Manager help"
          docker exec devnaro-ci devnaro --help
          echo "Smoke check: ports help"
          docker exec devnaro-ci devnaro ports --help
          echo "Smoke check: port-forwarding manager file"
          docker exec devnaro-ci test -f /opt/port-forwarding/manager.py
          echo "Smoke check: socat availability"
          docker exec devnaro-ci sh -lc 'command -v socat'
          echo "Smoke check: DevNaro Manager info"
          docker exec devnaro-ci devnaro info
          echo "Smoke check: base tools availability"
          docker exec devnaro-ci zsh -lic 'command -v zsh && command -v git && command -v python3 && command -v uv && command -v docker'
          echo "Smoke check: zsh completion registration"
          docker exec devnaro-ci zsh -fc 'source ~/.zshrc; (( $+functions[_devnaro_completion] )) && [[ ${_comps[dvn]} == _devnaro_completion ]]'
          echo "Smoke check: bash aliases and prompt"
          docker exec devnaro-ci bash -ic 'type dvn >/dev/null && devnaro_bash_prompt && [[ "$PS1" == *DEVNARO* ]] && command -v devnaro >/dev/null'
          echo "Smoke check: create Python virtual environment"
          docker exec devnaro-ci python3 -m venv /tmp/devnaro-prompt-venv
          echo "Smoke check: bash virtualenv prompt"
          docker exec devnaro-ci bash -ic 'source /tmp/devnaro-prompt-venv/bin/activate && devnaro_bash_prompt && [[ "$PS1" == *"(devnaro-prompt-venv)"* ]]'
          echo "Smoke check: zsh virtualenv prompt"
          docker exec devnaro-ci zsh -ic 'source /tmp/devnaro-prompt-venv/bin/activate && devnaro_update_prompt && [[ "$PROMPT" == *"devnaro-prompt-venv"* ]]'
          echo "Smoke check: host bridge, status command, and workspace"
          docker exec devnaro-ci sh -ec 'test -x /usr/local/bin/devnaro-host-bridge && test -x /usr/local/bin/devnaro-status && test -d /workspace'
          echo "Smoke check: Python version"
          docker exec devnaro-ci python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force devnaro-ci || true

      - name: Remove smoke-test home volume
        if: always()
        run: docker volume rm devnaro-home-ci || true
