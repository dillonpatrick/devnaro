name: DevBox validation

on:
  push:
    branches:
      - main
      - feat/python-cli-foundation
      - feat/stop-clean-lifecycle\n      - feat/alpine-linux-experiment
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.13.7"

      - name: Install locked package and development dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest

  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/host/install.sh
          bash -n scripts/host/devbox
          bash -n scripts/host/start.sh
          bash -n scripts/host/stop.sh
          bash -n scripts/host/clean.sh
          bash -n scripts/host/ensure-ports-config.sh
          sh -n scripts/container/entrypoint.sh
          python3 -m py_compile scripts/host/code_bridge.py scripts/container/code

      - name: Validate Docker Compose configuration
        run: |
          bash scripts/host/ensure-ports-config.sh
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ports.yml config --quiet

  docker-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build DevBox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: devbox:ci
          build-args: |
            USERNAME=devuser
            USER_UID=1000
            USER_GID=1000
            DOCKER_GID=966
