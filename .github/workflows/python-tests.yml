name: DevBox validation

on:
  push:
    branches:
      - main
      - feat/python-cli-foundation
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.13.7"

      - name: Install locked package and development dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest

  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: |
          bash -n scripts/host/install.sh
          bash -n scripts/host/devbox
          bash -n scripts/host/start.sh
          bash -n scripts/host/stop.sh

      - name: Validate Docker Compose configuration
        run: docker compose --project-directory . -f docker/docker-compose.yml config --quiet

  docker-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build DevBox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: devbox:ci
          build-args: |
            USERNAME=devuser
            USER_UID=1000
            USER_GID=1000
            DOCKER_GID=966
