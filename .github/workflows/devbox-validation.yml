name: DevBox validation

on:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.13.7"

      - name: Install locked package and development dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --locked pytest

  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/host/install.sh
          bash -n scripts/host/uninstall.sh
          bash -n scripts/host/devbox
          bash -n scripts/host/ci.sh
          bash -n scripts/host/compose.sh
          bash -n scripts/host/ui.sh
          bash -n scripts/host/start.sh
          bash -n scripts/host/stop.sh
          bash -n scripts/host/clean.sh
          LC_ALL=C bash scripts/host/devbox help > /tmp/devbox-help.txt
          grep -Fq '╭' /tmp/devbox-help.txt
          grep -Fq '╰' /tmp/devbox-help.txt
          grep -Fq 'devbox ci' /tmp/devbox-help.txt
          ! grep -Fq '�' /tmp/devbox-help.txt
          sh -n scripts/container/entrypoint.sh
          python3 -m py_compile scripts/container/code

      - name: Validate Docker Compose configuration
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml config --quiet

  docker-image-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base-image: debian:trixie-slim
            stack-name: default
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Exercise additional package manifest
        run: printf 'jq\n' >> docker/packages.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build DevBox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: devbox:ci
          build-args: |
            USERNAME=devuser
            USER_UID=1000
            USER_GID=1000
            DOCKER_GID=966
            BASE_IMAGE=${{ matrix.base-image }}
            STACK_NAME=${{ matrix.stack-name }}

      - name: Start DevBox container
        run: |
          mkdir -p "$RUNNER_TEMP/devbox-workspace"
          docker run --detach --name devbox-ci \
            --volume "$RUNNER_TEMP/devbox-workspace:/workspace" \
            devbox:ci

      - name: Run container smoke tests
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' devbox-ci)" == "true" ]]; then
              break
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Running}}' devbox-ci)" = "true"
          docker exec devbox-ci devbox-manager --version
          docker exec devbox-ci sudo -n apt-get --version
          docker exec devbox-ci devbox-manager --help
          docker exec devbox-ci devbox-manager ports --help
          docker exec devbox-ci test -f /opt/port-forwarding/manager.py
          docker exec devbox-ci sh -lc 'command -v socat'
          docker exec devbox-ci devbox-manager info
          docker exec devbox-ci devbox-manager tools search jq | grep -F jq
          docker exec devbox-ci zsh -lic 'command -v zsh && command -v git && command -v python3 && command -v uv && command -v docker && command -v jq'
          docker exec devbox-ci devbox-manager __complete -- tools '' | grep -Fx 'search'
          docker exec devbox-ci zsh -fc 'source ~/.zshrc; (( $+functions[_devbox_completion] )) && [[ ${_comps[dm]} == _devbox_completion ]]'
          docker exec devbox-ci sh -ec 'test -x /usr/local/bin/devbox-host-bridge && test -x /usr/local/bin/devbox-status && test -d /workspace'
          docker exec devbox-ci python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force devbox-ci || true
