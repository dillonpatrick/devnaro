services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GID: "${DOCKER_GID}"
    container_name: devbox-arch-omarchy
    command: tail -f /dev/null
    ports:
      - "3001:3001"
    volumes:
      - .:/code-container
      - /var/run/docker.sock:/var/run/docker.sock
      # Mapeia o arquivo local do host para dentro do container
      - ./.zsh_history:/home/devuser/.zsh_history
    working_dir: /code-container
    stdin_open: true
    tty: true

# O bloco 'volumes:' no final pode ser removido se não estiver sendo usado por mais nada.