services:
  devbox-alpine:
    build:
      context: .
      dockerfile: docker/Dockerfile.alpine
      args:
        USERNAME: ${USERNAME:-devuser}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-966}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.17.1}
        UV_VERSION: ${UV_VERSION:-0.13.7}
        OH_MY_ZSH_COMMIT: ${OH_MY_ZSH_COMMIT:-cca3bdfbef8c52ef8939ce7911ff68852b949daa}
    container_name: devbox-alpine
    hostname: devbox-alpine
    init: true
    stdin_open: true
    tty: true
    command: sleep infinity
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${WORKSPACE_PATH:-../workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devbox_alpine_home:/home/${USERNAME:-devuser}
    working_dir: /workspace

volumes:
  devbox_alpine_home:
