services:
  devbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USERNAME: ${USERNAME:-devuser}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-966}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.17.1}
        UV_VERSION: ${UV_VERSION:-0.13.7}
        OH_MY_ZSH_COMMIT: ${OH_MY_ZSH_COMMIT:-cca3bdfbef8c52ef8939ce7911ff68852b949daa}
    container_name: devbox
    hostname: devbox
    init: true
    stdin_open: true
    tty: true
    command: sleep infinity
    restart: unless-stopped

    # Publish common development ports on the host loopback only.
    # Applications inside DevBox must listen on 0.0.0.0, not 127.0.0.1.
    ports:
      - "127.0.0.1:3000-3010:3000-3010"
      - "127.0.0.1:4173:4173"
      - "127.0.0.1:5000-5010:5000-5010"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8000-8010:8000-8010"
      - "127.0.0.1:8080-8090:8080-8090"
      - "127.0.0.1:9000-9010:9000-9010"

    # Match the established main-branch container security settings.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${WORKSPACE_PATH:-../workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devbox_home:/home/${USERNAME:-devuser}
      # Host VS Code bridge (Unix socket; path generated by start.sh).
      - type: bind
        source: ${CODE_SOCKET_PATH:-/tmp/devbox-code.sock}
        target: /run/devbox-host/code.sock
        bind:
          create_host_path: false
    working_dir: /workspace

volumes:
  devbox_home:
