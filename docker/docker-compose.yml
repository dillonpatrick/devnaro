services:
  devbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        STACK_NAME: ${STACK_NAME:-default}
        USERNAME: ${USERNAME:-devuser}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-966}
        DEVBOX_BOOTSTRAP_UV_VERSION: ${DEVBOX_BOOTSTRAP_UV_VERSION:-0.13.7}
        OH_MY_ZSH_COMMIT: ${OH_MY_ZSH_COMMIT:-cca3bdfbef8c52ef8939ce7911ff68852b949daa}
    container_name: devbox
    hostname: devbox
    init: true
    stdin_open: true
    tty: true
    command: sleep infinity
    restart: unless-stopped

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${WORKSPACE_PATH:-../workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devbox_home:/home/${USERNAME:-devuser}
      - type: bind
        source: ${DEVBOX_PACKAGES_FILE:-./docker/packages.txt}
        target: /opt/devbox-config/packages.txt
        bind:
          create_host_path: false
      - type: bind
        source: ${CODE_SOCKET_PATH:-/tmp/devbox-code.sock}
        target: /run/devbox-host/code.sock
        bind:
          create_host_path: false
    working_dir: /workspace

volumes:
  devbox_home:
