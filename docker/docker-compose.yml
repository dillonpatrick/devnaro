services:
  devbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USERNAME: ${USERNAME:-devuser}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-966}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.17.1}
        UV_VERSION: ${UV_VERSION:-0.13.7}
        OH_MY_ZSH_COMMIT: ${OH_MY_ZSH_COMMIT:-cca3bdfbef8c52ef8939ce7911ff68852b949daa}
    container_name: devbox
    hostname: devbox
    init: true
    stdin_open: true
    tty: true
    command: sleep infinity
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${WORKSPACE_PATH:-../workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devbox_home:/home/${USERNAME:-devuser}
      - type: bind
        source: ${CODE_SOCKET_PATH:-/tmp/devbox-code-1000.sock}
        target: /run/devbox-host/code.sock
        bind:
          create_host_path: false
    working_dir: /workspace

volumes:
  devbox_home:
