services:
  devbox:
    # ==========================================
    # Build configuration
    # ==========================================

    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USERNAME: ${USERNAME:-devuser}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-966}

    # ==========================================
    # Container configuration
    # ==========================================

    container_name: devbox
    hostname: devbox

    init: true
    stdin_open: true
    tty: true

    command: sleep infinity

    restart: unless-stopped

    # Reduce the container's kernel-level privileges. Docker socket access
    # remains highly privileged and is required by DevBox.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # ==========================================
    # Environment variables
    # ==========================================

    environment:
      TZ: ${TZ:-UTC}

    # ==========================================
    # Volumes
    # ==========================================

    volumes:
      # Development workspace
      - ${WORKSPACE_PATH:-../workspace}:/workspace

      # Host Docker socket
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent user home
      - devbox_home:/home/${USERNAME:-devuser}

    # ==========================================
    # Working directory
    # ==========================================

    working_dir: /workspace

# ==========================================
# Persistent volumes
# ==========================================

volumes:
  devbox_home:
