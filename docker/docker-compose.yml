services:
  devnaro:
    image: devnaro:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        STACK_NAME: ${STACK_NAME:-default}
        USERNAME: ${USERNAME:-devuser}
        DEVNARO_BOOTSTRAP_UV_VERSION: ${DEVNARO_BOOTSTRAP_UV_VERSION:-0.13.7}
        OH_MY_ZSH_COMMIT: ${OH_MY_ZSH_COMMIT:-cca3bdfbef8c52ef8939ce7911ff68852b949daa}
    container_name: devnaro
    hostname: devnaro
    init: true
    stdin_open: true
    tty: true
    command: sleep infinity
    restart: unless-stopped

    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${WORKSPACE_PATH:-../workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devnaro_home:/home/${USERNAME:-devuser}
      - type: bind
        source: ${CODE_SOCKET_DIR:-/tmp/devnaro-host}
        target: /run/devnaro-host
        bind:
          create_host_path: false
    working_dir: /workspace

volumes:
  devnaro_home:
