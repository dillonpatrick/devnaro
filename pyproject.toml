[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devbox-manager"
version = "0.1.0"
description = "CLI utilities for the DevBox development environment"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1,<8",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
devbox-manager = "devbox_manager.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["devbox_manager*"]
